# Crawl4AI — le crawler qui alimente l'accueil client.
#
# Service Python à part : Next.js lui parle en HTTP (cf. src/lib/crawl/crawl4ai.ts)
# plutôt que d'embarquer Playwright et Chromium dans l'application.
#
#   docker compose -f docker-compose.crawl4ai.yml up -d
#   curl http://localhost:11235/health
#
# `shm_size` n'est pas décoratif : Chromium plante sur le /dev/shm de 64 Mo que
# Docker alloue par défaut dès qu'une page un peu lourde s'ouvre.

services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    shm_size: "1gb"
    environment:
      # Jeton facultatif. S'il est posé ici, reporter la même valeur dans
      # CRAWL4AI_TOKEN côté application.
      # - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN}
      - MAX_CONCURRENT_CRAWLS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
